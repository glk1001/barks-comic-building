[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barks_comic_building"]

[project]
name = "barks-comic-building"
version = "0.1.0"
description = "Scripts to upscale, restore, build, and inquire Barks comics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENCE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "barks-fantagraphics",
    "barks-build-comic-images",
    "barks-kivy-ui",
    "comic-utils",
    "bs4>=0.0.2",
    "cairosvg>=2.8.2",
    "cpi>=2.0.7",
    "distro>=1.9.0",
    "intspan>=1.6.1",
    "loguru>=0.7.3",
    "loguru-config>=0.1.0",
    "matplotlib>=3.10.5",
    "numba>=0.61.2",
    # Imported directly by the restore and query code. It also arrives transitively via
    # opencv/scikit-image/matplotlib, which is how it went undeclared until deptry said so.
    "numpy>=2.4.4",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.1",
    "psutil>=7.0.0",
    "pyoxipng>=9.1.1",
    # Likewise: barks_chronological_titles imports dateutil directly, and it would
    # otherwise ride in on matplotlib and cpi.
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "scikit-image>=0.25.2",
    "screeninfo>=0.8.1",
    "typer>=0.21.1",
    "vtracer>=0.6.11",
]

[project.scripts]
barks-chronological-titles = "barks_comic_building.query.barks_chronological_titles:app"
barks-yearly-page-count = "barks_comic_building.query.barks_yearly_page_count:app"
barks-yearly-payments = "barks_comic_building.query.barks_yearly_payments:app"
barks-cover-info = "barks_comic_building.query.cover_info:app"
barks-edit-page = "barks_comic_building.query.edit_page:app"
barks-fanta-info = "barks_comic_building.query.fantagraphics_info:app"
barks-fanta-make-dirs = "barks_comic_building.query.fantagraphics_make_dirs:app"
barks-fanta-story-page-count = "barks_comic_building.query.fantagraphics_stories_page_count:app"
barks-fanta-story-dims = "barks_comic_building.query.fantagraphics_story_dimensions:app"
barks-fanta-story-files = "barks_comic_building.query.fantagraphics_story_files:app"
barks-fanta-story-mods = "barks_comic_building.query.fantagraphics_story_mods:app"
barks-fanta-story-splashes = "barks_comic_building.query.fantagraphics_story_splashes:app"
barks-find-title = "barks_comic_building.query.find_title:app"
barks-find-title-from-volume = "barks_comic_building.query.find_title_from_volume:app"
barks-make-empty-configs = "barks_comic_building.query.make_empty_configs:app"
barks-one-pager-info = "barks_comic_building.query.one_pager_info:app"
barks-show-fixes-diffs = "barks_comic_building.query.show_fixes_diffs:app"
barks-show-panel-bounds = "barks_comic_building.query.show_panel_bounds:app"
barks-show-title-page = "barks_comic_building.query.show_title_page:app"
barks-show-volume-page = "barks_comic_building.query.show_volume_page:app"
barks-silent-night-restore = "barks_comic_building.query.silent_night_panel_restore:app"
barks-verify-title = "barks_comic_building.query.verify_title:app"
barks-build = "barks_comic_building.build.batch_build_comics:app"
barks-check-build = "barks_comic_building.build.check_build_comics_integrity:app"
barks-stage-covers = "barks_comic_building.build.stage_covers:app"
barks-stage-one-pagers = "barks_comic_building.build.stage_one_pagers:app"
barks-batch-panel-bounds = "barks_comic_building.restore.batch_panel_bounds:app"
barks-batch-restore = "barks_comic_building.restore.batch_restore_pipeline:app"
barks-batch-svg-to-png = "barks_comic_building.restore.batch_svg_to_png:app"
barks-batch-upscayl = "barks_comic_building.restore.batch_upscayl:app"
barks-directory-upscayl = "barks_comic_building.restore.directory_upscayl:app"
barks-ink-survey = "barks_comic_building.restore.ink_survey:app"
barks-restore-status = "barks_comic_building.restore.restore_status:app"
barks-restore-stop = "barks_comic_building.restore.run_stop:app"
barks-upscale-status = "barks_comic_building.restore.upscale_status:app"
barks-single-restore = "barks_comic_building.restore.single_restore_pipeline:app"
barks-single-upscayl = "barks_comic_building.restore.single_upscayl:app"

[tool.uv.sources]
barks-fantagraphics = { path = "../barks-compleat-reader/src/barks-fantagraphics", editable = true }
barks-build-comic-images = { path = "../barks-compleat-reader/src/barks-build-comic-images", editable = true }
barks-kivy-ui = { path = "../barks-compleat-reader/src/barks-kivy-ui", editable = true }
comic-utils = { path = "../barks-compleat-reader/src/comic-utils", editable = true }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.3.8",
    "pyrefly>=1.1.1",
    "pytest>=8.4.1",
    # Pinned: with select = ["ALL"] (via ../barks-compleat-reader/.ruff-base.toml), a
    # ruff release that stabilizes rules out of preview changes our lint policy, not
    # just the version. Bump deliberately and triage the new hits.
    "ruff==0.16.1",
    # Pinned to match the rest of the barks repos. 0.0.62 and 0.0.63 had a flaky
    # salsa panic that aborted files on roughly 1 in 3 runs of a large project;
    # 0.0.64 fixes that, and also a pathological inference blow-up that had this
    # project's check taking 67 seconds. ty is beta with 1.0 targeted for 2026, so
    # stay pinned until it stabilizes.
    "ty==0.0.65",
    "types-psutil>=7.2.2.20260518",
    "types-python-dateutil>=2.9.0.20260716",
]

[tool.deptry]
# `scraps` is excluded everywhere else too (ty.toml, pyrefly.toml, cspell.config.yaml);
# it holds throwaway code that imports whatever it likes. Everything else is analysed,
# including `scripts` - the justfile runs several of those against the dependency set
# below, so they are worth checking. (The sibling excludes its scripts tree, which is
# dev-only in a way this one is not.)
extend_exclude = [
    ".*scraps.*",
]

# Local modules, not distributions. `barks_comic_building` is this project itself, and
# the two compare_* modules are scripts importing their siblings in `scripts/` by bare
# name. Without this, every intra-project import reads as a transitive dependency.
known_first_party = [
    "barks_comic_building",
    "compare_build_dirs",
    "compare_images",
]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but not imported): all three are needed at runtime through a path
# deptry cannot see, because the shared path dependencies under-declare their own
# requirements - comic-utils in particular declares none at all, so this project's
# pyproject is what actually installs them.
#   - distro: comic_utils.sys_utils.get_hash_str, used by comics_integrity and
#     additional_file_writing, imports it.
#   - pyyaml: loguru-config declares only loguru, then lazily does `import yaml` inside
#     load_yaml_config - which is exactly how every CLI here loads log-config.yaml.
#   - screeninfo: show_panel_bounds -> barks_kivy_ui.page_viewer ->
#     comic_utils.screen_utils imports it.
# cryptography used to sit here for the same reason (comic_utils.get_panel_bytes decrypts
# with Fernet), but nothing in this project reaches that module - it is only used to read
# encrypted images out of a cbz, which is the reader's job - so it was dropped instead.
# Check reachability before adding to this list; declaring another package's dependency is
# only right when we actually pull it in.
DEP002 = [
    "distro",
    "pyyaml",
    "screeninfo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
